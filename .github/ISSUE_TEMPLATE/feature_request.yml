name: Feature Request
description: Suggest an idea for desktop.engineer
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for sharing your idea!
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: A clear description of what you're trying to achieve.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution
      description: What should the tool do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you've tried?
