name: Bug Report
description: Report an issue with desktop.engineer
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug!
  - type: input
    id: tool
    attributes:
      label: Tool
      description: Which tool/page has the issue?
      placeholder: e.g. HashChecker, SSH Key Generator, Home…
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Enter …
        3. See error
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, device
      placeholder: e.g. Chrome 125, Windows 11, Desktop
