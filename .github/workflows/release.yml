name: Release

on:
  push:
    branches: [master]
    paths: [package.json]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check tag exists
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Build
        if: steps.check.outputs.exists == 'false'
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

      - name: Package dist
        if: steps.check.outputs.exists == 'false'
        run: |
          cd dist
          zip -r ../desktop.engineer-${{ steps.version.outputs.tag }}.zip .

      - name: Extract release notes
        id: notes
        if: steps.check.outputs.exists == 'false'
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf-8'));
            const content = fs.readFileSync('src/data/changelog.js','utf-8');
            const m = {};
            const js = content.replace('export default ', 'm.exports = ');
            eval(js);
            const entry = m.exports.find(e => e.version === pkg.version);
            if (entry) {
              const tag = 'v' + pkg.version;
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'title=' + tag + ' - ' + entry.title.en + '\n');
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'body<<EOF\n' + entry.changes.en.map(c => '- ' + c).join('\n') + '\nEOF\n');
            }
          "

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.notes.outputs.title }}
          body: ${{ steps.notes.outputs.body }}
          files: desktop.engineer-${{ steps.version.outputs.tag }}.zip
